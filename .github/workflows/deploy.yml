# 自動部署：推到 main 分支 → 建置 → 測試 → 用 SSH 把 dist/ 同步到 SiteGround 的 public_html
# 需要在 GitHub 倉庫 Settings → Secrets and variables → Actions 設定：
#   SG_HOST  SiteGround SSH 主機（例如 ssgxx.siteground.biz 或 Site Tools 顯示的主機名）
#   SG_USER  SSH 使用者（例如 u1234-abcdefg）
#   SG_PORT  SSH 連接埠（SiteGround 預設 18765）
#   SG_KEY   SSH 私鑰全文（從 Site Tools → Devs → SSH Keys Manager 產生後「Private Key」的內容，含 BEGIN／END 兩行）
#   SG_PASS  產生金鑰時填的密碼（SiteGround 一定要填；沒密碼就留空）
#   SG_PATH  網站根目錄（例如 /home/customer/www/starcg.online/public_html）
name: Deploy to SiteGround
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 單元測試
        run: node tests/unit.mjs
      - name: 建置
        run: node build.mjs --sponsor="${{ vars.SPONSOR_URL }}" --sponsor-ko="${{ vars.SPONSOR_URL_KO }}" --video="${{ vars.WELCOME_VIDEO }}" --video-ko="${{ vars.WELCOME_VIDEO_KO }}" --naver="${{ vars.NAVER_VERIFY }}" --google="${{ vars.GOOGLE_VERIFY }}"
      - name: 設定 SSH
        env:
          SG_KEY: ${{ secrets.SG_KEY }}
          SG_PASS: ${{ secrets.SG_PASS }}
        run: |
          [ -n "${{ secrets.SG_HOST }}" ] || { echo "::error::缺少 Secret SG_HOST"; exit 1; }
          [ -n "${{ secrets.SG_USER }}" ] || { echo "::error::缺少 Secret SG_USER"; exit 1; }
          [ -n "${{ secrets.SG_PORT }}" ] || { echo "::error::缺少 Secret SG_PORT"; exit 1; }
          [ -n "$SG_KEY" ] || { echo "::error::缺少 Secret SG_KEY"; exit 1; }
          [ -n "${{ secrets.SG_PATH }}" ] || { echo "::error::缺少 Secret SG_PATH"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_KEY" > ~/.ssh/id_sg && chmod 600 ~/.ssh/id_sg
          ssh-keyscan -p "${{ secrets.SG_PORT }}" -H "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # 金鑰有密碼：交給 ssh-agent，密碼用 SSH_ASKPASS 餵進去
          eval "$(ssh-agent -s)" > /dev/null
          printf '#!/bin/sh\necho "$SG_PASS"\n' > ~/.ssh/askpass.sh && chmod 700 ~/.ssh/askpass.sh
          SSH_ASKPASS=~/.ssh/askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add ~/.ssh/id_sg < /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh -p "${{ secrets.SG_PORT }}" -o BatchMode=yes "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}" 'echo 連線成功: $(hostname)'
      - name: 上傳到 public_html
        run: |
          # data/pets.json 由伺服器每天向攻略網同步，不用倉庫裡的舊檔覆蓋；只在伺服器還沒有時當種子
          cp dist/data/pets.json dist/data/pets.seed.json
          rsync -az --delete \
            --exclude 'cache/' --exclude 'img/pets/' --exclude 'api/config.local.php' --exclude '.well-known/' \
            --exclude 'data/pets.json' --exclude 'data/pets.json.prev' \
            -e "ssh -p ${{ secrets.SG_PORT }} -o BatchMode=yes" \
            dist/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_PATH }}/"
      - name: 同步寵物圖鑑
        run: |
          ssh -p "${{ secrets.SG_PORT }}" -o BatchMode=yes "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}" \
            "cd '${{ secrets.SG_PATH }}' && { [ -s data/pets.json ] || cp data/pets.seed.json data/pets.json; } && php cron/sync-pets.php --images=60" || echo '圖鑑同步失敗（網站照常上線，api/pets.php 會再自動重試）'
      - name: 上線檢查
        run: |
          sleep 5
          curl -sfo /dev/null https://starcg.online/ && curl -sfo /dev/null https://starcg.online/ko/ && echo OK
